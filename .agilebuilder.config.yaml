version: "1.0"
name: vue3-vite-admin
description: Vue3 + Vite + TypeScript + Pinia + Vue Router + Element Plus admin dashboard template
variables:
  enabled: true
  delimiter: "%"
  filePatterns:
    mode: include
    patterns:
      - package.json
      - vite.config.ts
      - index.html
      - README.md
      - README.zh-CN.md
      - .env.development
      - .env.production
  inquirerQuestions:
    - name: projectName
      type: input
      message: Project name
      default: demo-admin
      required: true
    - name: description
      type: input
      message: Project description
      default: An admin dashboard app
    - name: author
      type: input
      message: Author
      default: ""
    - name: port
      type: number
      message: Dev server port
      default: 5173
    - name: packageManager
      type: list
      message: Package manager
      choices:
        - pnpm
        - npm
        - yarn
      default: pnpm
hooks:
  after_write:
    scriptType: shell
    script: 'git init && git add -A && git commit -m "chore: init project from template"'
    errorHandling: warn
market:
  slug: vue3-vite-admin
  name: Vue Vite admin app
  summary: Vue 3 admin starter with Vite, TypeScript, Pinia and Element Plus.
  description: |
    A ready-to-use admin dashboard frontend template with:

    - **Layout system**: classic admin layout with sidebar menu, top navigation and main content area
    - **Routing**: Vue Router setup with a 404 page and a `v-permission` directive example
    - **State management**: Pinia user store example (login state, permission points)
    - **Network layer**: axios wrapper with request/response interceptors for token handling and error messages
    - **Environment variables**: per-environment `.env.development` / `.env.production` config
    - **Tooling**: ESLint + Prettier + EditorConfig for consistent code style
  category: Frontend apps
  tags:
    - Vue 3
    - Vite
    - TypeScript
    - Element Plus
    - Admin
  version: 1.0.0
  gitUrl: https://github.com/agilebuilder/template-web-vue-vite-admin.git
  defaultBranch: main
  metadata-zh:
    name: Vue3 Vite 中后台管理模板
    summary: 基于 Vue3 + Vite + TypeScript + Pinia + Element Plus 的中后台管理系统脚手架
    description: |
      一个开箱即用的中后台管理系统前端模板，内置：

      - **布局系统**：侧边栏菜单 + 顶部导航 + 主内容区的经典后台布局
      - **路由方案**：Vue Router 配置，含 404 页面与 `v-permission` 权限指令示例
      - **状态管理**：Pinia user store 示例（登录态、权限点）
      - **网络层**：axios 二次封装，请求/响应拦截器统一处理 Token 与错误提示
      - **环境变量**：`.env.development` / `.env.production` 分环境配置
      - **工程规范**：ESLint + Prettier + EditorConfig，代码风格统一
    category: 前端应用
    tags:
      - Vue3
      - Vite
      - TypeScript
      - Element Plus
      - 中后台
